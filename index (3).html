<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b1324"><title>ORISMAC-SA Training & Compliance Portal</title><style>:root{--navy:#0b1f33;--blue:#1261a0;--bg:#f4f7fb;--card:#fff;--text:#182536;--muted:#6b7785;--border:#dfe6ee;--green:#1d8a5a;--amber:#b7791f;--red:#c53030;--shadow:0 8px 25px rgba(11,31,51,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b1f33,#1261a0)}.login-card{width:min(430px,92vw);background:#fff;border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.brand{text-align:center;margin-bottom:25px}.brand h1{margin:10px 0 4px;font-size:24px}.brand p{margin:0;color:var(--muted)}.logo{width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;margin:auto;font-weight:800;font-size:20px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#eef3f8;color:var(--navy)}.btn-danger{background:#fee2e2;color:#991b1b}.hint{background:#f4f8fc;border-radius:10px;padding:12px;font-size:12px;color:#556372;margin-top:16px}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.side-brand{font-weight:800;font-size:18px;padding:8px 10px 22px}.side-brand small{display:block;color:#a8bbce;font-size:11px;margin-top:4px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dce7f1;border:0;padding:12px;border-radius:9px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.side-bottom{position:absolute;bottom:20px;left:14px;right:14px}.main{padding:25px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.topbar h2{margin:0}.user-chip{background:#fff;border:1px solid var(--border);padding:9px 12px;border-radius:10px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:800;margin:6px 0}.muted{color:var(--muted);font-size:13px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-head h3{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;text-align:left;white-space:nowrap}th{background:#f7f9fc;font-size:12px;color:#566474;position:sticky;top:0}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.valid{background:#dcfce7;color:#166534}.expiring{background:#fef3c7;color:#92400e}.expired{background:#fee2e2;color:#991b1b}.missing{background:#e5e7eb;color:#374151}.urgent{color:var(--red);font-weight:800}.high{color:var(--amber);font-weight:800}.normal{color:var(--green);font-weight:800}.toolbar{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--border);border-radius:9px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;z-index:10}.modal-card{background:#fff;border-radius:16px;width:min(650px,96vw);max-height:90vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:35px;text-align:center;color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#eef6ff;color:#24527a;font-size:13px}.danger-note{background:#fff1f2;color:#9f1239}.file{font-size:12px;color:var(--blue)}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-bottom{position:static;margin-top:12px}}@media(max-width:650px){.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.main{padding:15px}}
</style></head><body><div id="app"></div><script>const AUTHORIZATIONS=[
['A001','SHEQ Induction','Site / SHEQ'],['A002','Confined Spaces','Training / Induction'],['A003','Safeguarding','Training / Induction'],['A004','Hazardous Materials','Training / Induction'],['A005','Surface Fire','Training / Induction'],['A006','Underground Fire','Training / Induction'],['A007','Isolation of Energies','Training / Induction'],['A008','Molten Materials','Training / Induction'],['A009','Lifting Operations','Training / Induction'],['A010','Working at Heights','Training / Induction'],['A011','Surface Traffic Management','Training / Induction'],['A012','Medical','Medical'],['A013','SMA','Site / SHEQ'],['A014','HOV / HOV','Licence / Competency'],['A015','First Aid','Emergency Response'],['A016','Fire Fighting','Emergency Response'],['A017','Telescopic Boom License','Licence / Competency'],['A018','Forklift License','Licence / Competency'],['A019','Hand Tools','Training / Induction'],['A020','Power Tools','Training / Induction'],['A021','Basic Lifting and Rigging','Training / Induction'],['A022','Cherry Picker','Training / Induction']
].map(x=>({id:x[0],name:x[1],category:x[2]}));
const DEMO={
 users:[{email:'admin@orismacsa.co.za',password:'Admin123!',role:'admin',name:'ORISMAC-SA Administrator',clientId:null},{email:'demo@client.co.za',password:'Client123!',role:'client',name:'Demo Client Manager',clientId:'C001'}],
 clients:[{id:'C001',name:'Demo Construction Client',contact:'Client Manager',email:'demo@client.co.za'}],
 employees:[
 {id:'EMP001',name:'Thabo Mokoena',job:'Safety Officer',project:'Delmas Project',company:'Demo Construction Client',supervisor:'Project Manager',start:'2025-03-01',active:'Yes',contact:'',clientId:'C001'},
 {id:'EMP002',name:'Lerato Ndlovu',job:'Supervisor',project:'Delmas Project',company:'Demo Construction Client',supervisor:'Project Manager',start:'2025-05-12',active:'Yes',contact:'',clientId:'C001'},
 {id:'EMP003',name:'Sipho Dlamini',job:'Operator',project:'Delmas Project',company:'Demo Construction Client',supervisor:'Supervisor',start:'2026-01-10',active:'Yes',contact:'',clientId:'C001'}],
 trainings:[
 {id:'TR0001',employeeId:'EMP001',auth:'SHEQ Induction',cert:'SHEQ-001',issue:'2026-01-10',expiry:'2027-01-10',booking:'Not Booked',file:'',remarks:'',clientId:'C001'},
 {id:'TR0002',employeeId:'EMP001',auth:'Working at Heights',cert:'WAH-002',issue:'2026-02-15',expiry:'2026-09-05',booking:'Planned',file:'',remarks:'Renewal planning required',clientId:'C001'},
 {id:'TR0003',employeeId:'EMP002',auth:'First Aid',cert:'FA-003',issue:'2025-08-01',expiry:'2026-08-15',booking:'Not Booked',file:'',remarks:'Expired - arrange renewal',clientId:'C001'},
 {id:'TR0004',employeeId:'EMP002',auth:'Medical',cert:'MED-004',issue:'2026-02-01',expiry:'2027-02-01',booking:'Not Booked',file:'',remarks:'',clientId:'C001'},
 {id:'TR0005',employeeId:'EMP003',auth:'Forklift License',cert:'FL-005',issue:'2026-07-01',expiry:'2026-09-15',booking:'Planned',file:'',remarks:'',clientId:'C001'}],
 bookings:[{id:'BK0001',employeeId:'EMP001',auth:'Working at Heights',expiry:'2026-09-05',due:'2026-08-15',provider:'',appointment:'',status:'Planned',ref:'',responsible:'ORISMAC-SA',notes:'Contact provider'}]
};
let db=JSON.parse(localStorage.getItem('orismacDB')||'null')||DEMO; let session=JSON.parse(localStorage.getItem('orismacSession')||'null'); let page='dashboard';
function save(){localStorage.setItem('orismacDB',JSON.stringify(db))} function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(prefix){let n=1; const arr=prefix==='EMP'?db.employees:prefix==='TR'?db.trainings:prefix==='BK'?db.bookings:[]; while(arr.some(x=>x.id===prefix+String(n).padStart(4,'0')))n++; return prefix+String(n).padStart(4,'0')}
function visible(a){if(session?.role==='admin')return a; return a.filter(x=>x.clientId===session.clientId)}
function empName(id){return db.employees.find(e=>e.id===id)?.name||id}
function status(expiry){if(!expiry)return'MISSING';const d=Math.ceil((new Date(expiry+'T23:59:59')-new Date())/86400000);if(d<0)return'EXPIRED';if(d<=30)return'EXPIRING ≤30 DAYS';return'VALID'}
function badge(s){let c=s==='VALID'?'valid':s==='EXPIRED'?'expired':s==='MISSING'?'missing':'expiring';return `<span class="status ${c}">${esc(s)}</span>`}
function days(expiry){if(!expiry)return'';return Math.ceil((new Date(expiry+'T23:59:59')-new Date())/86400000)}
function login(){document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const email=emailEl.value.trim().toLowerCase(),pw=passwordEl.value;const u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===pw);if(!u)return alert('Invalid login details.');session=u;localStorage.setItem('orismacSession',JSON.stringify(session));render()};}
function render(){if(!session){document.getElementById('app').innerHTML=`<div class="login"><div class="login-card"><div class="brand"><div class="logo">OSA</div><h1>ORISMAC-SA</h1><p>Training & Compliance Portal</p></div><form id="loginForm"><div class="field"><label>Email</label><input id="emailEl" type="email" required placeholder="name@company.co.za"></div><div class="field"><label>Password</label><input id="passwordEl" type="password" required></div><button class="btn btn-primary" style="width:100%">Sign in</button></form><div class="hint"><b>Prototype demo accounts</b><br>Admin: admin@orismacsa.co.za / Admin123!<br>Client: demo@client.co.za / Client123!</div></div></div>`;login();return}
const nav=[['dashboard','Dashboard'],['employees','Employees'],['training','Training Records'],['expiry','Expiry Report'],['bookings','Booking & Renewal'],['reports','Reports & Downloads']]; if(session.role==='admin')nav.push(['clients','Clients'],['authorisations','Authorisations']);
document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="side-brand">ORISMAC-SA<small>Safety Administration Support</small></div><nav class="nav">${nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="page='${n[0]}';render()">${n[1]}</button>`).join('')}</nav><div class="side-bottom"><button class="btn btn-secondary" style="width:100%" onclick="logout()">Sign out</button></div></aside><main class="main"><div class="topbar"><div><h2>${title()}</h2><div class="muted">${session.role==='admin'?'ORISMAC-SA Administrator':esc(db.clients.find(c=>c.id===session.clientId)?.name||'Client Portal')}</div></div><div class="user-chip">${esc(session.name)} · ${session.role}</div></div><div id="content"></div></main></div>`; drawPage();}
function title(){return {dashboard:'Compliance Dashboard',employees:'Employee Register',training:'Training Records',expiry:'Expiry Report',bookings:'Booking & Renewal Log',reports:'Reports & Downloads',clients:'Client Management',authorisations:'Authorisations'}[page]||'Portal'}
function drawPage(){const c=document.getElementById('content'); if(page==='dashboard')c.innerHTML=dashboard();if(page==='employees')c.innerHTML=employees();if(page==='training')c.innerHTML=training();if(page==='expiry')c.innerHTML=expiry();if(page==='bookings')c.innerHTML=bookings();if(page==='reports')c.innerHTML=reports();if(page==='clients')c.innerHTML=clients();if(page==='authorisations')c.innerHTML=authorisations();}
function dashboard(){const es=visible(db.employees),ts=visible(db.trainings);const counts={VALID:0,'EXPIRING ≤30 DAYS':0,EXPIRED:0,MISSING:0};ts.forEach(t=>counts[status(t.expiry)]++);return `<div class="cards"><div class="card"><div class="muted">Total Employees</div><div class="metric">${es.length}</div></div><div class="card"><div class="muted">Training Records</div><div class="metric">${ts.length}</div></div><div class="card"><div class="muted">Valid</div><div class="metric">${counts.VALID}</div></div><div class="card"><div class="muted">Expiring ≤30 Days</div><div class="metric">${counts['EXPIRING ≤30 DAYS']}</div></div><div class="card"><div class="muted">Expired</div><div class="metric">${counts.EXPIRED}</div></div></div><div class="section"><div class="section-head"><h3>Attention Required</h3><button class="btn btn-secondary" onclick="page='expiry';render()">View full report</button></div><div class="table-wrap">${expiryTable(ts.filter(t=>status(t.expiry)!=='VALID').slice(0,10))}</div></div>`}
function expiryTable(ts){if(!ts.length)return `<div class="empty">No records require attention.</div>`;return `<table><thead><tr><th>Employee</th><th>Authorisation</th><th>Expiry</th><th>Days</th><th>Status</th><th>Booking</th><th>Priority</th></tr></thead><tbody>${ts.map(t=>{let s=status(t.expiry),p=s==='EXPIRED'?'URGENT':s==='EXPIRING ≤30 DAYS'?'HIGH':'CHECK';return `<tr><td>${esc(empName(t.employeeId))}</td><td>${esc(t.auth)}</td><td>${esc(t.expiry||'-')}</td><td>${days(t.expiry)}</td><td>${badge(s)}</td><td>${esc(t.booking||'')}</td><td class="${p==='URGENT'?'urgent':p==='HIGH'?'high':'normal'}">${p}</td></tr>`}).join('')}</tbody></table>`}
function employees(){const es=visible(db.employees);return `<div class="section-head"><div class="actions"><button class="btn btn-primary" onclick="employeeModal()">+ Add Employee</button>${session.role==='admin'?'<button class="btn btn-secondary" onclick="importExcel()">Import Excel Tracker</button>':''}</div></div><div class="toolbar"><input id="empSearch" placeholder="Search employee, job or project" oninput="filterTable('empSearch','empTable')"></div><div class="table-wrap" style="margin-top:12px"><table id="empTable"><thead><tr><th>ID</th><th>Employee Name</th><th>Job Title</th><th>Project / Department</th><th>Company</th><th>Supervisor</th><th>Active</th><th>Action</th></tr></thead><tbody>${es.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.job)}</td><td>${esc(e.project)}</td><td>${esc(e.company)}</td><td>${esc(e.supervisor)}</td><td>${esc(e.active)}</td><td><button class="btn btn-secondary" onclick="employeeModal('${e.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function training(){const ts=visible(db.trainings);return `<div class="section-head"><button class="btn btn-primary" onclick="trainingModal()">+ Add Training Record</button></div><div class="toolbar"><input id="trSearch" placeholder="Search employee or training" oninput="filterTable('trSearch','trTable')"><select onchange="filterStatus(this.value,'trTable')"><option value="">All statuses</option><option>VALID</option><option>EXPIRING ≤30 DAYS</option><option>EXPIRED</option><option>MISSING</option></select></div><div class="table-wrap" style="margin-top:12px"><table id="trTable"><thead><tr><th>Record</th><th>Employee</th><th>Authorisation</th><th>Certificate No.</th><th>Issue</th><th>Expiry</th><th>Days</th><th>Booking</th><th>Status</th><th>Certificate</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(empName(t.employeeId))}</td><td>${esc(t.auth)}</td><td>${esc(t.cert)}</td><td>${esc(t.issue||'')}</td><td>${esc(t.expiry||'')}</td><td>${days(t.expiry)}</td><td>${esc(t.booking||'')}</td><td>${badge(status(t.expiry))}</td><td>${t.file?`<a class="file" href="${t.file}" target="_blank">View</a>`:'-'}</td></tr>`).join('')}</tbody></table></div>`}
function expiry(){const ts=visible(db.trainings).sort((a,b)=>(days(a.expiry)||99999)-(days(b.expiry)||99999));return `<div class="notice">Review this report weekly. ORISMAC-SA can use the Booking & Renewal Log to arrange renewals before certificates expire.</div><div class="table-wrap" style="margin-top:12px">${expiryTable(ts)}</div>`}
function bookings(){const bs=visible(db.bookings);return `<div class="section-head"><button class="btn btn-primary" onclick="bookingModal()">+ Add Booking</button></div><div class="table-wrap"><table><thead><tr><th>Booking ID</th><th>Employee</th><th>Authorisation</th><th>Current Expiry</th><th>Booking Due</th><th>Provider</th><th>Appointment</th><th>Status</th><th>Responsible</th></tr></thead><tbody>${bs.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(empName(b.employeeId))}</td><td>${esc(b.auth)}</td><td>${esc(b.expiry||'')}</td><td>${esc(b.due||'')}</td><td>${esc(b.provider||'')}</td><td>${esc(b.appointment||'')}</td><td>${esc(b.status||'')}</td><td>${esc(b.responsible||'')}</td></tr>`).join('')}</tbody></table></div>`}
function reports(){return `<div class="cards"><div class="card"><b>Employee Register</b><p class="muted">Download the client employee register as CSV.</p><button class="btn btn-primary" onclick="downloadEmployees()">Download</button></div><div class="card"><b>Training Register</b><p class="muted">Download all training and authorisation records.</p><button class="btn btn-primary" onclick="downloadTraining()">Download</button></div><div class="card"><b>Expiry Report</b><p class="muted">Download records requiring attention.</p><button class="btn btn-primary" onclick="downloadExpiry()">Download</button></div><div class="card"><b>Booking & Renewal</b><p class="muted">Download renewal booking activity.</p><button class="btn btn-primary" onclick="downloadBookings()">Download</button></div></div><div class="section"><div class="notice">For production deployment, reports and certificates should be stored in secure server-side storage rather than browser local storage.</div></div>`}
function clients(){return `<div class="section-head"><button class="btn btn-primary" onclick="clientModal()">+ Add Client</button></div><div class="table-wrap"><table><thead><tr><th>Client ID</th><th>Company</th><th>Contact</th><th>Email</th><th>Employees</th><th>Action</th></tr></thead><tbody>${db.clients.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.contact)}</td><td>${esc(c.email)}</td><td>${db.employees.filter(e=>e.clientId===c.id).length}</td><td><button class="btn btn-secondary" onclick="clientUserModal('${c.id}')">Create Login</button></td></tr>`).join('')}</tbody></table></div>`}
function authorisations(){return `<div class="notice">Controlled list imported from the ORISMAC-SA Excel tracker. ${AUTHORIZATIONS.length} authorisations are available for selection.</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>ID</th><th>Authorisation / Training</th><th>Category</th></tr></thead><tbody>${AUTHORIZATIONS.map(a=>`<tr><td>${a.id}</td><td>${esc(a.name)}</td><td>${esc(a.category)}</td></tr>`).join('')}</tbody></table></div>`}
function filterTable(inputId,tableId){const q=document.getElementById(inputId).value.toLowerCase();document.querySelectorAll(`#${tableId} tbody tr`).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function filterStatus(v,id){document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=!v||r.innerText.includes(v)?'':'none')}
function modal(html){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modal-card">${html}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function employeeModal(id=''){const e=db.employees.find(x=>x.id===id)||{};const client=session.role==='admin'?(e.clientId||db.clients[0]?.id||''):session.clientId;modal(`<div class="modal-head"><h3>${id?'Edit':'Add'} Employee</h3><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Close</button></div><form onsubmit="saveEmployee(event,'${id}')"><div class="grid2"><div class="field"><label>Employee ID</label><input name="id" value="${esc(e.id||uid('EMP'))}" ${id?'readonly':''} required></div><div class="field"><label>Employee Name & Surname</label><input name="name" value="${esc(e.name||'')}" required></div><div class="field"><label>Job Title</label><input name="job" value="${esc(e.job||'')}"></div><div class="field"><label>Department / Project</label><input name="project" value="${esc(e.project||'')}"></div><div class="field"><label>Company</label><input name="company" value="${esc(e.company||db.clients.find(c=>c.id===client)?.name||'')}"></div><div class="field"><label>Supervisor / Manager</label><input name="supervisor" value="${esc(e.supervisor||'')}"></div><div class="field"><label>Start Date</label><input type="date" name="start" value="${esc(e.start||'')}"></div><div class="field"><label>Contact Number</label><input name="contact" value="${esc(e.contact||'')}"></div><div class="field"><label>Active?</label><select name="active"><option ${e.active!=='No'?'selected':''}>Yes</option><option ${e.active==='No'?'selected':''}>No</option></select></div>${session.role==='admin'?`<div class="field"><label>Client</label><select name="clientId">${db.clients.map(c=>`<option value="${c.id}" ${client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}</div><button class="btn btn-primary">Save Employee</button></form>`)}
function saveEmployee(ev,id){ev.preventDefault();const f=new FormData(ev.target),o=Object.fromEntries(f.entries());o.clientId=session.role==='admin'?o.clientId:session.clientId; if(id)Object.assign(db.employees.find(x=>x.id===id),o);else db.employees.push(o);save();ev.target.closest('.modal').remove();render()}
function trainingModal(){const emps=visible(db.employees);modal(`<div class="modal-head"><h3>Add Training Record</h3><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Close</button></div><form onsubmit="saveTraining(event)"><div class="grid2"><div class="field"><label>Employee</label><select name="employeeId" required>${emps.map(e=>`<option value="${e.id}">${esc(e.name)} (${e.id})</option>`).join('')}</select></div><div class="field"><label>Authorisation</label><select name="auth" required>${AUTHORIZATIONS.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Certificate / Licence No.</label><input name="cert"></div><div class="field"><label>Issue Date</label><input type="date" name="issue"></div><div class="field"><label>Expiry Date</label><input type="date" name="expiry"></div><div class="field"><label>Booking Status</label><select name="booking"><option>Not Booked</option><option>Planned</option><option>Booked</option><option>Completed</option></select></div><div class="field"><label>Certificate file</label><input type="file" id="certFile" accept=".pdf,.jpg,.jpeg,.png"></div><div class="field"><label>Remarks</label><input name="remarks"></div></div><button class="btn btn-primary">Save Training Record</button></form>`)}
function saveTraining(ev){ev.preventDefault();const f=new FormData(ev.target),o=Object.fromEntries(f.entries());o.id=uid('TR');o.clientId=session.role==='admin'?(db.employees.find(e=>e.id===o.employeeId)?.clientId||db.clients[0]?.id):session.clientId;o.file='';const file=document.getElementById('certFile').files[0];const finish=()=>{db.trainings.push(o);save();ev.target.closest('.modal').remove();render()};if(file){const r=new FileReader();r.onload=()=>{o.file=r.result;finish()};r.readAsDataURL(file)}else finish()}
function bookingModal(){const emps=visible(db.employees);modal(`<div class="modal-head"><h3>Add Renewal Booking</h3><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Close</button></div><form onsubmit="saveBooking(event)"><div class="grid2"><div class="field"><label>Employee</label><select name="employeeId" required>${emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Authorisation / Medical</label><select name="auth">${AUTHORIZATIONS.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Current Expiry Date</label><input type="date" name="expiry"></div><div class="field"><label>Booking Due Date</label><input type="date" name="due"></div><div class="field"><label>Provider / Training Centre</label><input name="provider"></div><div class="field"><label>Appointment Date</label><input type="date" name="appointment"></div><div class="field"><label>Booking Status</label><select name="status"><option>Planned</option><option>Requested</option><option>Booked</option><option>Completed</option><option>Cancelled</option></select></div><div class="field"><label>Responsible Person</label><input name="responsible" value="ORISMAC-SA"></div><div class="field"><label>Reference No.</label><input name="ref"></div><div class="field"><label>Notes</label><input name="notes"></div></div><button class="btn btn-primary">Save Booking</button></form>`)}
function saveBooking(ev){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target).entries());o.id=uid('BK');o.clientId=session.role==='admin'?(db.employees.find(e=>e.id===o.employeeId)?.clientId||db.clients[0]?.id):session.clientId;db.bookings.push(o);save();ev.target.closest('.modal').remove();render()}
function clientModal(){modal(`<div class="modal-head"><h3>Add Client</h3><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Close</button></div><form onsubmit="saveClient(event)"><div class="field"><label>Company Name</label><input name="name" required></div><div class="grid2"><div class="field"><label>Contact Person</label><input name="contact"></div><div class="field"><label>Email</label><input type="email" name="email"></div></div><button class="btn btn-primary">Create Client</button></form>`)}
function saveClient(ev){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target).entries());o.id='C'+String(db.clients.length+1).padStart(3,'0');db.clients.push(o);save();ev.target.closest('.modal').remove();render()}
function clientUserModal(cid){const c=db.clients.find(x=>x.id===cid);modal(`<div class="modal-head"><h3>Create Client Login</h3><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Close</button></div><form onsubmit="saveUser(event,'${cid}')"><p class="muted">Client: ${esc(c.name)}</p><div class="field"><label>Login Email</label><input name="email" type="email" value="${esc(c.email||'')}" required></div><div class="field"><label>Temporary Password</label><input name="password" value="Client123!" required></div><button class="btn btn-primary">Create Login</button></form>`)}
function saveUser(ev,cid){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target).entries());db.users.push({...o,role:'client',name:db.clients.find(c=>c.id===cid)?.contact||'Client Manager',clientId:cid});save();ev.target.closest('.modal').remove();alert('Client login created.');render()}
function importExcel(){alert('Excel import is disabled in the standalone offline demo. The production web version will support secure Excel imports.');}
function csv(name,rows){const out=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download=name;a.click()}
function downloadEmployees(){const es=visible(db.employees);csv('ORISMAC-SA_Employee_Register.csv',[['Employee ID','Employee Name','Job Title','Department / Project','Company','Supervisor','Start Date','Active','Contact'],...es.map(e=>[e.id,e.name,e.job,e.project,e.company,e.supervisor,e.start,e.active,e.contact])])}
function downloadTraining(){const ts=visible(db.trainings);csv('ORISMAC-SA_Training_Register.csv',[['Record ID','Employee ID','Employee Name','Authorisation','Certificate No','Issue Date','Expiry Date','Days Remaining','Booking Status','Status','Remarks'],...ts.map(t=>[t.id,t.employeeId,empName(t.employeeId),t.auth,t.cert,t.issue,t.expiry,days(t.expiry),t.booking,status(t.expiry),t.remarks])])}
function downloadExpiry(){const ts=visible(db.trainings);csv('ORISMAC-SA_Expiry_Report.csv',[['Employee ID','Employee Name','Authorisation','Certificate No','Expiry Date','Days Remaining','Status','Booking Status','Priority'],...ts.map(t=>{let s=status(t.expiry);return[t.employeeId,empName(t.employeeId),t.auth,t.cert,t.expiry,days(t.expiry),s,t.booking,s==='EXPIRED'?'URGENT':s==='EXPIRING ≤30 DAYS'?'HIGH':'NORMAL']})])}
function downloadBookings(){const bs=visible(db.bookings);csv('ORISMAC-SA_Booking_Renewal_Log.csv',[['Booking ID','Employee ID','Employee Name','Authorisation','Current Expiry','Booking Due','Provider','Appointment','Status','Reference','Responsible','Notes'],...bs.map(b=>[b.id,b.employeeId,empName(b.employeeId),b.auth,b.expiry,b.due,b.provider,b.appointment,b.status,b.ref,b.responsible,b.notes])])}
function logout(){session=null;localStorage.removeItem('orismacSession');render()}
render();
</script></body></html>
